name: Update CDN Statistics

on:
  # Manual trigger for on-demand updates
  workflow_dispatch:

  # Daily at 04:00 UTC (offset from IGDB 00:00 and Ubisoft 03:00 jobs)
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and update CDN statistics
        run: |
          python -u update_stats.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stats/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CDN statistics ($(date +'%Y-%m-%d'))"
            git push
          fi
